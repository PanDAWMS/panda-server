name: Syntax Check

on: [pull_request]

# a new push to the PR supersedes the previous check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    # --diff-filter=d drops the paths the PR deleted. The diff names them, and
    # py_compile is then handed a file that is no longer there, which fails the
    # step for a deletion that was the point of the change.
    - name: Check syntax of changed files
      run: |
        files=$(git diff --name-only --diff-filter=d origin/master...HEAD -- '*.py')
        if [ -n "$files" ]; then
          echo "$files" | xargs -n1 python -m py_compile
        else
          echo "No Python files changed."
        fi
