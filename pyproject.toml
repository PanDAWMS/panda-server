[build-system]
requires = ["hatchling", "hatch-vcs", "requests"]
build-backend = "hatchling.build"


[project]
name = "panda-server"
dynamic = ["version"]
description = "Unified PanDA Server and JEDI Package"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    { name = "PanDA Team", email = "panda-support@cern.ch" },
]
dependencies = [
    'panda-common>=0.1.9',
    'panda-client-light>=1.5.55',
    'pyOpenSSL',
    'python-daemon',
    'mod_wsgi',
    'stomp.py',
    'pyyaml',
    'pyjwt',
    'polars',
    'requests',
    'psutil>=5.4.8',
    'idds-common',
    'idds-client',
    'idds-workflow>=1.1.0',
    'idds-doma',
    'idds-atlas',
    'ruamel.yaml',
    'cwl-utils>=0.13',
    'packaging',
    'snakemake>=9.14.5',
    'numpy',
    'scipy',
    'werkzeug',
    'requests',
    'bs4'
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
oracle = ['oracledb']
mysql = ['mysqlclient']
postgres =  ['psycopg2-binary']
rucio = ['rucio-clients']
elasticsearch = ['elasticsearch']
atlasprod =  ['oracledb', 'rucio-clients', 'elasticsearch', 'numpy', 'scipy']
mcp = ['uvicorn', 'fastmcp']

[project.urls]
Homepage = "https://panda-wms.readthedocs.io/en/latest/"

[tool.hatch.version]
path = "PandaPkgInfo.py"
pattern = "release_version = \"(?P<version>[^\"]+)\""

[tool.hatch.build]
directory = "dist"

[tool.hatch.build.targets.wheel]
exclude = ["*.template", "PandaPkgInfo.py", "hatch_build.py"]
packages = ["pandaserver", "pandajedi"]

[tool.hatch.build.targets.wheel.shared-data]
"templates" = "etc/panda"
"templates/bin" = "usr/bin"
"templates/init.d" = "etc/rc.d/init.d"
"templates/systemd" = "etc/systemd/system"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "package/hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    ".idea",
]


[tool.black]
line-length=160

[tool.autopep8]
# https://pypi.org/project/autopep8/#pyproject-toml
max_line_length = 160
ignore = ["E501", "W6"]
in-place = true
recursive = true
aggressive = 3

[tool.pylint.master]
max-line-length = 160
[tool.pylint.'MESSAGES CONTROL']
disable = [
    "C0209",
    "R0902",
    "R0913",
    "R0914", #  R0914: Too many local variables
]

[tool.isort]
profile = "black"

[tool.flynt]
line-length = 160

[tool.flake8]
ignore = ['E501', 'U100']

# The tree is clean under these flags and CI fails on any finding, so a change that
# introduces one has to fix it. Widening them further will surface findings that were
# never counted; do that in a PR that also resolves them, together with the mypy pin in
# .github/workflows/syntax-check.yml. --strict is not the next step: most of what it adds
# is disallow_untyped_calls, which reports a call into an unannotated function rather than
# an unannotated function, so it counts the same gaps again from the other side.
[tool.mypy]
files = ["pandaserver", "pandajedi"]
# CI installs mypy and two stub packages and nothing else, so every third-party import in
# the tree is unresolvable there and would otherwise be 455 findings that say nothing
# about this code. The override below takes this back off for pandaserver and pandajedi.
ignore_missing_imports = true
# Without this, mypy skips the body of every function that has no annotations --
# which is most of this tree, so the gate would only cover the code that needs it
# least. New code goes through the gate whether or not its author annotates it.
check_untyped_defs = true
# A bare `dict` or `list` in an annotation says nothing about what is in it, and
# nothing outside mypy -- the code map, an MCP tool schema, the next reader -- can
# recover it. Filling the parameters in is what makes an annotation worth having,
# so it is required rather than left to whoever writes the line.
disallow_any_generics = true
# A function that declares a type and then returns a value the checker knows nothing about
# has an annotation nobody verified. Most of those values are real -- a cursor result, a
# json.loads, a plugin the configuration named -- so this does not ask for them to go away;
# it asks for the type to be written on the value where it is received, which is the one
# place a reader can check it against the code that produced it.
warn_return_any = true
# Every function states the type of each parameter and of what it returns. A function that
# does not is not a style problem: it is a function whose body check_untyped_defs above
# checks in isolation and whose call sites nothing checks at all, so a wrong argument
# reaches production. disallow_incomplete_defs is the other half -- without it a single
# annotation on one parameter counts as annotating the function.
disallow_untyped_defs = true
disallow_incomplete_defs = true

# ignore_missing_imports silences a module mypy cannot find, which for a first-party path
# means it silences a typo: the name becomes Any and nothing is reported. ruff F821 cannot
# see a module path at all and py_compile does not import, so an import naming a module
# that is not there passed every gate. Seven of them were in the tree, two fatal in
# production and three written by the annotation work itself. For ignore_missing_imports
# the module patterns match the module being imported, not the file importing it, so
# naming the two first-party roots here makes only their paths a findable-or-fail matter
# and leaves every third-party import silent.
[[tool.mypy.overrides]]
module = [
    "pandajedi.*",
    "pandaserver.*",
]
ignore_missing_imports = false
