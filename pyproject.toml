[build-system]
requires = ["hatchling", "hatch-vcs", "requests"]
build-backend = "hatchling.build"


[project]
name = "panda-server"
dynamic = ["version"]
description = "Unified PanDA Server and JEDI Package"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    { name = "PanDA Team", email = "panda-support@cern.ch" },
]
dependencies = [
    'panda-common>=0.1.9',
    'panda-client-light>=1.5.55',
    'pyOpenSSL',
    'python-daemon',
    'mod_wsgi',
    'stomp.py',
    'pyyaml',
    'pyjwt',
    'polars',
    'requests',
    'psutil>=5.4.8',
    'idds-common',
    'idds-client',
    'idds-workflow>=1.1.0',
    'idds-doma',
    'idds-atlas',
    'ruamel.yaml',
    'cwl-utils>=0.13',
    'packaging',
    'snakemake>=9.14.5',
    'numpy',
    'scipy',
    'werkzeug',
    'requests',
    'bs4'
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
oracle = ['oracledb']
mysql = ['mysqlclient']
postgres =  ['psycopg2-binary']
rucio = ['rucio-clients']
elasticsearch = ['elasticsearch']
atlasprod =  ['oracledb', 'rucio-clients', 'elasticsearch', 'numpy', 'scipy']
mcp = ['uvicorn', 'fastmcp']

[project.urls]
Homepage = "https://panda-wms.readthedocs.io/en/latest/"

[tool.hatch.version]
path = "PandaPkgInfo.py"
pattern = "release_version = \"(?P<version>[^\"]+)\""

[tool.hatch.build]
directory = "dist"

[tool.hatch.build.targets.wheel]
exclude = ["*.template", "PandaPkgInfo.py", "hatch_build.py"]
packages = ["pandaserver", "pandajedi"]

[tool.hatch.build.targets.wheel.shared-data]
"templates" = "etc/panda"
"templates/bin" = "usr/bin"
"templates/init.d" = "etc/rc.d/init.d"
"templates/systemd" = "etc/systemd/system"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "package/hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    ".idea",
]


[tool.black]
line-length=160

[tool.autopep8]
# https://pypi.org/project/autopep8/#pyproject-toml
max_line_length = 160
ignore = ["E501", "W6"]
in-place = true
recursive = true
aggressive = 3

[tool.pylint.master]
max-line-length = 160
[tool.pylint.'MESSAGES CONTROL']
disable = [
    "C0209",
    "R0902",
    "R0913",
    "R0914", #  R0914: Too many local variables
]

[tool.isort]
profile = "black"

[tool.flynt]
line-length = 160

[tool.flake8]
ignore = ['E501', 'U100']

# The tree is clean under these flags and CI fails on any finding, so a change that
# introduces one has to fix it. Widening the flags (the strictness options are all
# still off) will surface findings that were never counted; do that in a PR that
# also resolves them, together with the mypy pin in
# .github/workflows/syntax-check.yml.
[tool.mypy]
files = ["pandaserver", "pandajedi"]
# CI installs mypy and two stub packages and nothing else, so every third-party import in
# the tree is unresolvable there and would otherwise be 455 findings that say nothing
# about this code. The override below takes this back off for pandaserver and pandajedi.
ignore_missing_imports = true
# Without this, mypy skips the body of every function that has no annotations --
# which is most of this tree, so the gate would only cover the code that needs it
# least. New code goes through the gate whether or not its author annotates it.
check_untyped_defs = true
# A bare `dict` or `list` in an annotation says nothing about what is in it, and
# nothing outside mypy -- the code map, an MCP tool schema, the next reader -- can
# recover it. Filling the parameters in is what makes an annotation worth having,
# so it is required rather than left to whoever writes the line.
disallow_any_generics = true

# ignore_missing_imports silences a module mypy cannot find, which for a first-party path
# means it silences a typo: the name becomes Any and nothing is reported. ruff F821 cannot
# see a module path at all and py_compile does not import, so an import naming a module
# that is not there passed every gate. Seven of them were in the tree, two fatal in
# production and three written by the annotation work itself. For ignore_missing_imports
# the module patterns match the module being imported, not the file importing it, so
# naming the two first-party roots here makes only their paths a findable-or-fail matter
# and leaves every third-party import silent.
[[tool.mypy.overrides]]
module = [
    "pandajedi.*",
    "pandaserver.*",
]
ignore_missing_imports = false

# disallow_untyped_defs and disallow_incomplete_defs are being turned on a subpackage at a
# time. Tree-wide they report ~2869 findings, far too many for one change, and unlike the
# flags above they cannot be satisfied by a mechanical edit: every function needs its
# parameter and return types read out of the code.
#
# Each name below is a subpackage that is already clean under both flags, so the gate holds
# it there. The list now covers every subpackage in the tree except pandaserver.pandamcp,
# which reads and rewrites __annotations__ at runtime, so annotating it changes what its MCP
# tool definitions do and belongs in its own change. When that lands, the two settings move
# up into [tool.mypy] and this block is deleted.
[[tool.mypy.overrides]]
module = [
    "pandajedi.jedibrokerage.*",
    "pandajedi.jediconfig.*",
    "pandajedi.jedicore.*",
    "pandajedi.jediddm.*",
    "pandajedi.jedidog.*",
    "pandajedi.jediexec.*",
    "pandajedi.jedigen.*",
    "pandajedi.jedimsgprocessor.*",
    "pandajedi.jediorder.*",
    "pandajedi.jedipprocess.*",
    "pandajedi.jedirefine.*",
    "pandajedi.jedisetup.*",
    "pandajedi.jedithrottle.*",
    "pandaserver.api.*",
    "pandaserver.asyncprocess.*",
    "pandaserver.brokerage.*",
    "pandaserver.config.*",
    "pandaserver.configurator.*",
    "pandaserver.daemons.*",
    "pandaserver.dataservice.*",
    "pandaserver.jobdispatcher.*",
    "pandaserver.proxycache.*",
    "pandaserver.server.*",
    "pandaserver.srvcore.*",
    "pandaserver.taskbuffer.*",
    "pandaserver.test.*",
    "pandaserver.userinterface.*",
    "pandaserver.workflow.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
